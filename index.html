<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0f24">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>MUSA</title>
<link rel="stylesheet" href="src/css/variables.css">
<script>
(function(){
  const isMobile = ("ontouchstart" in window || navigator.maxTouchPoints > 0) && window.innerWidth < 768;
  const platform = isMobile ? "mobile" : "desktop";
  document.documentElement.classList.add(platform);
  const link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = "src/css/" + platform + ".css";
  document.head.appendChild(link);
})();
</script>
</head>
<body>
<div id="app">
  <aside class="sidebar" aria-label="Navegaçăo principal">
    <div class="sidebar-header">
      <div class="logo">MUSA</div>
      <div class="subtitle">Mulheres, Universo, Saúde, Arte</div>
    </div>
    <nav class="sidebar-nav" id="sidenav"></nav>
    <div class="sidebar-footer">v2 · Dados só seus</div>
  </aside>
  <main id="v"></main>
  <nav id="nav" class="bottom-nav" aria-label="Navegaçăo mobile"></nav>
</div>
<div id="lk" class="modal-container"></div>
<div id="sp" class="modal-container"></div>
<div id="toast"></div>
<script type="module" src="src/js/main.js"></script>
</body>
</html>
