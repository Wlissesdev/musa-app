<style>

a.tel{display:block;padding:13px;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;color:var(--ink);text-decoration:none;font-weight:600}

.cover input{background:#4a1a3a;color:#f6ebe0;border-color:#6a3a58;text-align:center;margin:14px 0}.cover .mute,#lk .mute{color:#d6b9c9}
#lk{display:none}#lk.on{display:block}.dots{display:flex;gap:14px;justify-content:center;margin:18px 0}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #e8a893}.dots i.f{background:#e8a893}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}.keys button{height:62px;border-radius:50%;border:1px solid #6a3a58;background:#ffffff0f;color:#f6ebe0;font:24px system-ui}.keys button:active{background:#ffffff33}
.lnk{background:none;border:0;color:#e8a893;margin-top:16px;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.3s;z-index:20;pointer-events:none;white-space:nowrap}#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#sp.on{display:flex}#sp.out{display:flex;opacity:0;pointer-events:none}#sp .in2{width:100%}#sp .mute{color:#d6b9c9}#sp .q{animation:up 1s .3s both}
#sp::before{content:"";position:fixed;width:300px;height:300px;border-radius:50%;background:#d9604a;filter:blur(70px);opacity:.45;top:-100px;right:-100px;animation:drift 10s infinite alternate}
#sp .pg{position:fixed;left:0;bottom:0;height:3px;background:#e8a893;animation:pg 7s linear both}@keyframes pg{from{width:0}to{width:100%}}
</style></head><body><div id="app"><main id="v"></main><nav id="nav"></nav></div><div id="lk"></div><div id="sp"></div><div id="toast"></div>
<script>
const IMG="icons/nise.jpg",$=s=>document.querySelector(s),K="musa.v2";
const MOODS=["😞","😕","😐","🙂","😊"],ML=["Muito mal","Mal","Neutra","Bem","Muito bem"];
const TAGS=["Ansiosa","Cansada","Irritada","Triste","Calma","Grata","Sobrecarregada","Sozinha","Motivada","Insônia","Com medo","Esperançosa"];
const PROMPTS=["O que meu corpo está tentando me dizer hoje?","Qual silêncio eu carreguei esta semana e posso nomear?","Quem eu era aos 10 anos e o que ela diria para mim agora?","Uma coisa que fiz por mim hoje, mesmo pequena.","O que eu gostaria de ouvir de alguém neste momento?","Qual desejo meu eu deixei de lado e por quê?","Escreva uma carta curta para a mulher que você será em um ano."];
const AP=["Desenhe como o seu dia está por dentro, sem se preocupar com o resultado.","Escolha uma cor para o que você sente agora e deixe a mão se mover.","Faça linhas, formas ou manchas. Não precisa ser “bonito”.","Desenhe um lugar onde você se sente segura."];
const QS=[["Não se curem além da conta. Gente curada demais é gente chata.","Frase atribuída a Nise da Silveira"],["Sentir não é fraqueza. É informação sobre o que importa para você.","MUSA"],["Descansar também é cuidar. Você não precisa merecer uma pausa.","MUSA"],["Pedir ajuda é uma forma de coragem, não de fracasso.","MUSA"],["Hoje basta um passo pequeno. Ele ainda conta.","MUSA"]];
const RIT=[["agua","💧","Água"],["sono","🌙","Dormir bem"],["corpo","🚶‍♀️","Mover o corpo"],["sol","☀️","Sol ou ar livre"],["gente","💬","Falar com alguém"],["arte","🎨","Momento de arte"]];
const BOOKS=[["A Redoma de Vidro","Sylvia Plath","Quando tudo parece certo por fora e pesado por dentro: o que você ainda não disse em voz alta?"],["Garota, Interrompida","Susanna Kaysen","Quem decide o que é “normal”? Como você se trata quando foge do esperado?"],["As Virgens Suicidas","Jeffrey Eugenides","Quem ouve quem está em silêncio ao seu redor?"],["A Bolsa Amarela","Lygia Bojunga","Que desejos você guarda na sua “bolsa”?"],["Olhos d’água","Conceição Evaristo","Que memórias de mulheres da sua família ainda moram em você?"],["Ciranda de Pedra","Lygia Fagundes Telles","Que afeto faltou e como você pode oferecê-lo a si mesma?"]];
const BR=[["Relaxar · 4-2-6",[["Inspire",4,1.3],["Segure",2,1.3],["Solte",6,1]]],["Quadrada · 4-4-4-4",[["Inspire",4,1.3],["Segure",4,1.3],["Solte",4,1],["Segure",4,1]]],["Sono · 4-7-8",[["Inspire",4,1.3],["Segure",7,1.3],["Solte",8,1]]]];
const BD=[["🌱","Primeiro passo","1º registro",()=>Object.keys(S.log).length>=1],["🔥","3 dias","3 dias seguidos",()=>streak()>=3],["🌟","7 dias","7 dias seguidos",()=>streak()>=7],["📖","Escritora","1º texto",()=>S.journal.length>=1],["🎨","Artista","1º desenho",()=>S.art.length>=1],["🌿","Dia de cuidado","6 rituais",()=>Object.values(S.rit).some(a=>a.length>=RIT.length)],["🛡️","Protegida","PIN ou plano",()=>!!S.pin||!!S.plan.people]];
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||{name:"",log:{},journal:[],rit:{},art:[],plan:{},pin:null};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast("Sem espaço para salvar")}};
const dk=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const today=dk(),dayN=Math.floor(Date.now()/864e5),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SEC=!!(window.crypto&&crypto.subtle);
let tab="hoje",draft={mood:null,energy:3,sleep:3,tags:[],note:""},bt=null,bi=0,pm=null,fst="",buf="",pt=["",""],fails=0,until=0,hid=0,ac="#d9604a",az=10,ae=false;
function toast(t){const e=$("#toast");e.textContent=t;e.className="on";clearTimeout(toast.t);toast.t=setTimeout(()=>e.className="",2400)}
const nb=()=>BD.filter(b=>b[3]()).length;
function ach(f){const b=nb();f();save();render(0);if(nb()>b)toast("🏅 Nova conquista desbloqueada")}
function streak(){let n=0;for(let i=0;i<400;i++){const d=new Date();d.setDate(d.getDate()-i);if(S.log[dk(d)])n++;else if(i>0)break}return n}
const TABS=[["hoje","🌸","Hoje"],["diario","📖","Diário"],["ateli","🎨","Ateliê"],["calma","🌿","Calma"],["eu","✨","Eu"]];
function go(t){tab=t;stopB();render()}
function render(a=1){
 if(pm=="unlock")return;const v=$("#v"),st=v.scrollTop;
 if(!S.name){$("#nav").innerHTML="";v.innerHTML=cover();return}
 $("#nav").innerHTML=TABS.map(t=>`<button class="${t[0]==tab?"on":""}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("");
 v.innerHTML=({hoje,diario,ateli,calma,eu})[tab]();
 if(a){v.className="";void v.offsetWidth;v.className="in";v.scrollTop=0}else v.scrollTop=st;
 if(tab=="ateli")artInit()}
function cover(){return `<div class="cover"><div class="in2"><img src="${IMG}" alt="Nise da Silveira"><h1 style="font-size:40px;margin-top:18px">MUSA</h1><p class="q" style="font-size:20px">Um diário para escutar você.</p><p class="mute">Inspirado em Nise da Silveira, que acreditava em cuidar com arte, afeto e escuta.</p><input id="nm" placeholder="Como posso te chamar?" maxlength="30" autocomplete="off"><button class="btn" onclick="start()">Começar</button><p class="mute" style="font-size:12px;margin-top:18px">Seus registros ficam só neste aparelho. O MUSA não substitui acompanhamento psicológico ou médico.</p></div></div>`}
function start(){const n=$("#nm").value.trim();if(!n){$("#nm").focus();return}S.name=n;save();render()}
function hoje(){
 const l=S.log[today],h=new Date().getHours(),g=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite",q=QS[dayN%QS.length],sk=streak(),rd=S.rit[today]||[];
 return `<div class="hero"><div class="hrow"><div><div class="sm">${new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</div><h1>${g}, ${esc(S.name)}</h1></div><img class="av" src="${IMG}" alt=""></div><p class="q">“${q[0]}”</p><div class="sm" style="text-transform:none">${q[1]}</div>${sk?`<span class="fl">🔥 ${sk} ${sk>1?"dias seguidos":"dia"}</span>`:""}</div>`+
 (l?`<div class="card"><h3>Registro de hoje ${MOODS[l.mood]}</h3><p class="mute">${ML[l.mood]}${l.tags.length?" · "+l.tags.join(", "):""}</p><button class="btn alt" onclick="delete S.log[today];save();render(0)">Refazer registro</button></div>`:
 `<div class="card"><h3>Como você está agora?</h3><div class="moods">${MOODS.map((m,i)=>`<button class="${draft.mood===i?"on":""}" aria-label="${ML[i]}" onclick="draft.mood=${i};render(0)">${m}</button>`).join("")}</div>
 <label>Energia: ${draft.energy}/5</label><input type="range" min="1" max="5" value="${draft.energy}" oninput="draft.energy=+this.value;this.previousElementSibling.textContent='Energia: '+this.value+'/5'">
 <label>Qualidade do sono: ${draft.sleep}/5</label><input type="range" min="1" max="5" value="${draft.sleep}" oninput="draft.sleep=+this.value;this.previousElementSibling.textContent='Qualidade do sono: '+this.value+'/5'">
 <label>O que você sente?</label><div class="row">${TAGS.map(t=>`<button class="chip ${draft.tags.includes(t)?"on":""}" onclick="tg('${t}')">${t}</button>`).join("")}</div>
 <label>Nota rápida (opcional)</label><textarea style="min-height:70px" oninput="draft.note=this.value">${esc(draft.note)}</textarea><div class="gap"></div><button class="btn" onclick="saveLog()">Salvar registro</button></div>`)+
 `<div class="card"><div class="rh"><svg class="ring" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" class="rb"/><circle cx="30" cy="30" r="26" class="rf" style="stroke-dashoffset:${163.4*(1-rd.length/RIT.length)}"/></svg><div><h3>Rituais de hoje</h3><p class="mute" style="margin:0">${rd.length} de ${RIT.length} cuidados feitos</p></div></div><div class="row">${RIT.map(r=>`<button class="chip ${rd.includes(r[0])?"on":""}" onclick="rt('${r[0]}')">${r[1]} ${r[2]}</button>`).join("")}</div></div>`+insights()}
function tg(t){const a=draft.tags,i=a.indexOf(t);i<0?a.push(t):a.splice(i,1);render(0)}
function saveLog(){if(draft.mood===null){toast("Escolha como você está");return}ach(()=>{S.log[today]={...draft};draft={mood:null,energy:3,sleep:3,tags:[],note:""}});toast("Registro salvo 💛")}
function rt(id){ach(()=>{const a=S.rit[today]||(S.rit[today]=[]),i=a.indexOf(id);i<0?a.push(id):a.splice(i,1)})}
function insights(){
 const ds=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return[dk(d),["D","S","T","Q","Q","S","S"][d.getDay()]]});
 const all=Object.values(S.log),vals=ds.map(d=>S.log[d[0]]).filter(Boolean),avg=vals.length?(vals.reduce((a,b)=>a+b.mood+1,0)/vals.length).toFixed(1):"–";
 const cnt={};all.forEach(l=>l.tags.forEach(t=>cnt[t]=(cnt[t]||0)+1));const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]).join(", ");
 const m=a=>a.length?a.reduce((s,l)=>s+l.mood+1,0)/a.length:0,gs=all.filter(l=>l.sleep>=4),bs=all.filter(l=>l.sleep<=2);
 const ins=gs.length>=2&&bs.length>=2?`<p style="margin:12px 0 0;font-size:14px">💡 Nos dias de sono bom, seu humor médio foi ${m(gs).toFixed(1)}. Nos de sono ruim, ${m(bs).toFixed(1)}.</p>`:"";
 return `<div class="card"><h3>Sua semana</h3><p class="mute">Humor médio: ${avg}/5${top?" · Mais frequentes: "+top:""}</p><div class="bars">${ds.map(d=>{const l=S.log[d[0]];return `<div><i style="height:${l?(l.mood+1)*16:3}px;opacity:${l?1:.25}"></i>${d[1]}</div>`}).join("")}</div>${ins}</div>`}
function diario(){
 const i=dayN%PROMPTS.length;
 return `<h1 style="margin-bottom:12px">Diário</h1><div class="card"><p class="mute">Sugestão de hoje</p><h3 style="margin-bottom:10px">${PROMPTS[i]}</h3><textarea id="jt" placeholder="Escreva sem se preocupar em estar certa."></textarea><div class="gap"></div><button class="btn" onclick="addJ(${i})">Salvar texto</button></div>`+
 (S.journal.length?S.journal.map(j=>`<div class="card"><div class="mute">${esc(j.d)}</div><p class="mute" style="font-family:Georgia,serif;font-style:italic">${esc(j.p)}</p><p style="white-space:pre-wrap;margin:6px 0 10px">${esc(j.t)}</p><button class="chip" onclick="delJ(${j.id})">Apagar</button></div>`).join(""):`<p class="mute">Seus textos aparecem aqui. Escreva o primeiro.</p>`)}
function addJ(i){const t=$("#jt").value.trim();if(!t){$("#jt").focus();return}ach(()=>S.journal.unshift({id:Date.now(),d:new Date().toLocaleDateString("pt-BR"),p:PROMPTS[i],t}));toast("Texto salvo")}
function delJ(id){if(confirm("Apagar este texto?")){S.journal=S.journal.filter(j=>j.id!=id);save();render(0)}}
const COLS=["#d9604a","#e8a893","#e0b84a","#4f8f73","#3a6ea5","#6a3a8a","#2b1425"];
function ateli(){
 return `<h1>Ateliê</h1><p class="mute">Nise da Silveira via na pintura um caminho de expressão. Às vezes a cor diz o que a palavra não alcança.</p><div class="card"><p class="mute">${AP[dayN%AP.length]}</p><canvas id="cv" width="600" height="600"></canvas><div class="row" style="align-items:center;margin-bottom:10px">${COLS.map((c,i)=>`<button class="sw ${i==0?"on":""}" style="background:${c}" aria-label="Cor ${i+1}" onclick="setC('${c}',this)"></button>`).join("")}</div><div class="row" style="margin-bottom:12px"><button class="chip" onclick="az=5">Fino</button><button class="chip" onclick="az=10">Médio</button><button class="chip" onclick="az=24">Grosso</button><button class="chip" id="er" onclick="ae=!ae;this.classList.toggle('on',ae)">Borracha</button><button class="chip" onclick="artClear()">Limpar</button></div><button class="btn" onclick="artSave()">Salvar na galeria</button></div>`+
 (S.art.length?`<h3 style="margin:6px 0 10px">Sua galeria</h3><div class="gal">${S.art.map((a,i)=>`<div><img src="${a}" alt="Desenho ${i+1}"><button class="chip" style="background:var(--card)" onclick="delA(${i})">✕</button></div>`).join("")}</div>`:`<p class="mute">Seus desenhos ficam guardados aqui.</p>`)}
function setC(c,b){ac=c;ae=false;$("#er").classList.remove("on");document.querySelectorAll(".sw").forEach(s=>s.classList.remove("on"));b.classList.add("on")}
let cx;function artClear(){if(cx){cx.fillStyle="#fbf3e6";cx.fillRect(0,0,600,600)}}
function artInit(){const c=$("#cv");if(!c)return;cx=c.getContext("2d");cx.lineCap=cx.lineJoin="round";artClear();let d=false,l;
 const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*600/r.height]};
 const ln=(a,b)=>{cx.strokeStyle=ae?"#fbf3e6":ac;cx.lineWidth=az;cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke()};
 c.onpointerdown=e=>{d=true;l=p(e);c.setPointerCapture(e.pointerId);ln(l,[l[0]+.1,l[1]])};
 c.onpointermove=e=>{if(!d)return;const n=p(e);ln(l,n);l=n};c.onpointerup=c.onpointercancel=()=>d=false}
function artSave(){ach(()=>{S.art.unshift($("#cv").toDataURL("image/jpeg",.6));S.art=S.art.slice(0,12)});toast("Desenho guardado 🎨")}
function delA(i){if(confirm("Apagar este desenho?")){S.art.splice(i,1);save();render(0)}}
function calma(){return `<h1>Respirar</h1><div class="row" style="margin:12px 0">${BR.map((b,i)=>`<button class="chip ${i==bi?"on":""}" onclick="stopB();bi=${i};render(0)">${b[0]}</button>`).join("")}</div><div class="circle" id="bc">Pronta?</div><button class="btn" id="bb" onclick="breath()">Começar</button><div class="card" style="margin-top:20px"><h3>Se estiver difícil agora</h3><p class="mute">Olhe ao redor e nomeie 3 coisas que vê, 2 que ouve e 1 que toca. Depois beba um pouco de água.</p></div>`}
function stopB(){clearTimeout(bt);bt=null}
function breath(){const c=$("#bc"),b=$("#bb");
 if(bt){stopB();c.style.transform="";c.textContent="Pronta?";b.textContent="Começar";return}
 b.textContent="Parar";const P=BR[bi][1];
 const run=i=>{const[n,s,k]=P[i%P.length];c.style.transition=`transform ${s}s ease-in-out`;c.style.transform=`scale(${k})`;c.textContent=n;bt=setTimeout(()=>run(i+1),s*1000)};run(0)}
function eu(){const p=S.plan;
 return `<div class="card"><h3>Precisa de ajuda agora?</h3><p class="mute">No Brasil, os atendimentos abaixo são gratuitos.</p><a class="tel" href="tel:188">CVV · 188 · apoio emocional 24h</a><a class="tel" href="tel:192">SAMU · 192 · emergência médica</a><a class="tel" href="tel:180">Ligue 180 · violência contra a mulher</a></div>
 <div class="card"><h3>Conquistas · ${nb()}/${BD.length}</h3><div class="bd" style="margin-top:10px">${BD.map(b=>`<div class="${b[3]()?"":"lk"}"><b>${b[0]}</b>${b[1]}</div>`).join("")}</div></div>
 <div class="card"><h3>Meu plano de apoio</h3><p class="mute">Escreva agora, com calma, para consultar nos dias difíceis.</p>
 <label>Sinais de que não estou bem</label><textarea onchange="S.plan.signs=this.value;save()">${esc(p.signs)}</textarea>
 <label>O que me ajuda a me acalmar</label><textarea onchange="S.plan.coping=this.value;save()">${esc(p.coping)}</textarea>
 <label>Pessoa de confiança</label><input value="${esc(p.people)}" placeholder="Nome" onchange="S.plan.people=this.value;save();render(0)"><label>Telefone dela</label><input type="tel" value="${esc(p.phone)}" onchange="S.plan.phone=this.value.replace(/[^0-9+]/g,'');save();render(0)">
 ${p.phone?`<div class="gap"></div><a class="tel" href="tel:${esc(p.phone)}">Ligar para ${esc(p.people||"minha pessoa de confiança")}</a>`:""}</div>
 <div class="card"><h3>Leituras que abrem conversa</h3><p class="mute">Inspiradas nas obras da pesquisa MUSA. Leve a pergunta para o diário.</p>${BOOKS.map(b=>`<div class="bk"><b>${b[0]}</b><div class="mute" style="font-size:12px;margin:0">${b[1]}</div><p style="margin:4px 0 0;font-size:14px">${b[2]}</p></div>`).join("")}</div>
 <div class="card"><h3>Segurança e privacidade</h3><p class="mute">Seus dados ficam só neste aparelho e nunca são enviados. ${S.pin?"O PIN protege a abertura do app.":"Crie um PIN para proteger a abertura do app."}</p>${SEC?(S.pin?`<button class="btn alt" onclick="pm='off';buf='';sp('Remover PIN','Digite o PIN atual.')">Remover PIN</button>`:`<button class="btn" onclick="pm='new';buf='';sp('Criar PIN','Escolha 4 números.')">Criar PIN de 4 dígitos</button>`):`<p class="mute">PIN indisponível neste navegador.</p>`}</div>
 <div class="card"><h3>Sobre o MUSA</h3><p style="font-size:14px;margin:0">O MUSA nasceu de uma pesquisa de literatura comparada sobre saúde mental feminina da ArteCeb. Nise da Silveira lembra que cuidar também é escutar, criar e acolher. Este app não substitui profissionais de saúde.</p></div>
 <div class="card"><h3>Seus dados</h3><div class="gap"></div><button class="btn alt" onclick="cp()">Copiar meus dados</button><div class="gap"></div><button class="btn alt" onclick="wipe()">Apagar tudo</button></div>`}
function cp(){try{navigator.clipboard.writeText(JSON.stringify({...S,art:[],pin:null},null,1)).then(()=>toast("Dados copiados"),()=>toast("Não foi possível copiar"))}catch(e){toast("Não foi possível copiar")}}
function wipe(){if(confirm("Apagar todos os seus registros? Isso não pode ser desfeito.")){try{localStorage.removeItem(K)}catch(e){}S={name:"",log:{},journal:[],rit:{},art:[],plan:{},pin:null};tab="hoje";render()}}
/* PIN */
const hx=async(p,s)=>{const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(s),iterations:150000,hash:"SHA-256"},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")};
function sp(t,s){pt=[t,s||""];drawPad()}
function drawPad(){const e=$("#lk");e.className="on";e.innerHTML=`<div class="in2"><img class="lkimg" src="${IMG}" alt=""><h2 style="margin-top:14px">${pt[0]}</h2><p class="mute">${pt[1]}</p><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<buf.length?"f":""}"></i>`).join("")}</div><div class="keys">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>`<button ${k===""?"disabled style='visibility:hidden'":""} onclick="key('${k}')">${k}</button>`).join("")}</div>${pm=="unlock"?"":`<button class="lnk" onclick="pm=null;buf='';$('#lk').className=''">Cancelar</button>`}</div>`}
const shk=()=>{const d=$(".dots");d&&d.classList.add("shake")},cl=()=>{pm=null;$("#lk").className=""};
async function key(k){
 if(k=="⌫")buf=buf.slice(0,-1);else if(buf.length<4)buf+=k;
 if(buf.length<4){drawPad();return}
 const b=buf;buf="";
 if(pm=="unlock"||pm=="off"){
  if(Date.now()<until){sp("Aguarde um pouco","Muitas tentativas. Tente em 30 segundos.");shk();return}
  if(await hx(b,S.pin.s)==S.pin.h){fails=0;const o=pm=="off";cl();if(o){S.pin=null;save();toast("PIN removido")}render()}
  else{if(++fails>=5){until=Date.now()+30000;fails=0}sp("PIN incorreto","Tente novamente.");shk()}
 }else if(pm=="new"){fst=b;pm="conf";sp("Confirme o PIN","Digite novamente.")}
 else if(pm=="conf"){if(b==fst){const s=[...crypto.getRandomValues(new Uint8Array(12))].join("");S.pin={s,h:await hx(b,s)};cl();ach(()=>{});toast("PIN ativado 🔒")}else{pm="new";sp("Não coincidiu","Crie o PIN novamente.");shk()}}}
document.addEventListener("visibilitychange",()=>{if(document.hidden)hid=Date.now();else if(S.pin&&S.name&&pm!="unlock"&&Date.now()-hid>30000){pm="unlock";buf="";sp("Bem-vinda de volta","Digite seu PIN.")}});
